name: Build Home Assistant Add-ons

on:
  push:
    branches:
      - main
    paths:
      - "traefik/**"

jobs:
  build:
    name: Build Traefik Add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@2026.02.1
        with:
          args: --target traefik --image "ghcr.io/blendi/traefik-{arch}" --amd64 --aarch64
