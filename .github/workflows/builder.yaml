name: Build Home Assistant Add-ons

on:
  push:
    branches:
      - main
    paths:
      - "traefik/**"
      - "Iperf3/**"

jobs:
  build:
    name: Build ${{ matrix.addon.name }} Add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: traefik
            target: traefik
            image: ghcr.io/blendi/traefik
          - name: Iperf3
            target: Iperf3
            image: ghcr.io/blendi/iperf3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --target ${{ matrix.addon.target }} \
            --image "${{ matrix.addon.image }}-{arch}" \
            --amd64 \
            --aarch64
