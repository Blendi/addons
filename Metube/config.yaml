name: "MeTube"
description: "YouTube music downloader"
version: "0.1.45"
slug: "metube"
arch:
  - amd64
url: "https://github.com/alexta69/metube/pkgs/container/metube"
#image: "ghcr.io/blendi/metube-{arch}"
map:
  - type: media
    read_only: False
  - type: share
    read_only: False
init: "false"
startup: "application"
ports:
  8081/tcp: "8081"
ports_description:
  8081/tcp: "MeTube Web Port"
webui: "http://[HOST]:[PORT:8081]"
options:
  DOWNLOAD_DIR: "/media/My_Music/Youtube"
schema:
  DOWNLOAD_DIR: "str"
